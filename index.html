<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#392e24"><title>百味饭馆</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="styles.css"><script defer src="src/config.js"></script><script defer src="src/engine.js"></script><script defer src="assets/audio/bank.js"></script><script defer src="src/audio.js"></script><script defer src="src/scene-layout.js"></script><script defer src="src/presentation.js"></script><script defer src="src/storage.js"></script><script defer src="src/app.js"></script></head>
<body><main id="game-shell" class="game-shell" aria-label="百味饭馆竖屏游戏">
<div id="home-ui" class="home-ui">
<section id="game-scene" class="game-scene" aria-label="饭馆经营场景"><span id="scene-level" class="sr-only"></span><div class="queue-area"><span class="queue-caption">候客 <b id="queue-count"></b></span><div id="queue-people"></div></div><div id="tables"></div><div id="layout-guides" class="layout-guides" aria-hidden="true" hidden></div><div class="kitchen"><span id="chef-name"></span><div id="stoves"></div></div><div id="effects" class="effects"></div><div id="visual-layer" class="visual-layer" aria-hidden="true"></div><div id="pause-overlay" class="pause-overlay" hidden><strong>歇一会儿</strong><button id="resume-button">继续营业</button><button id="debug-step" hidden>推进 1 秒（验收实验）</button></div></section>
<header class="resource-hud"><button class="shop-title" data-screen="overview"><span class="shop-seal">百味</span><span><strong id="restaurant-name"></strong><small id="restaurant-summary"></small></span></button><span class="cash-badge">¥ <b id="cash"></b></span><button id="sound-button" class="icon-button" aria-label="开启声音">♪</button><button id="settings-button" class="icon-button" aria-label="设置">⚙</button><div class="ingredients"><span><i class="red-dot"></i>红 <b id="red"></b></span><span><i class="green-dot"></i>绿 <b id="green"></b></span><span><i class="blue-dot"></i>蓝 <b id="blue"></b></span><span>▣ 铭牌 <b id="fragments"></b></span></div></header>
<section class="gift-strip" aria-label="模拟礼物"><div id="gifts"></div><div class="gift-note"><span id="gift-feedback"></span><span id="pity-counter"></span></div></section>
<div class="today-strip"><span id="business-label"></span><span>客人 <b id="arrivals"></b></span><span>营业额 <b id="revenue"></b></span><time id="game-time"></time></div>
<div class="left-tools"><button id="pause-button"></button><button id="speed-cycle" aria-label="切换经营倍速"><span id="speed-cycle-value">1×</span><small>倍速</small></button><button id="help-button"><span>?</span><small>玩法</small></button></div>
<nav class="scene-nav" aria-label="管理页面"><button data-screen="overview"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18l-2-6H5l-2 6Zm2 0v11h14V10M9 21v-7h6v7M3 10c0 3 4 3 4 0 0 3 5 3 5 0 0 3 5 3 5 0 0 3 4 3 4 0"/></svg></span><small>饭馆</small></button><button data-screen="menu"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5c-3-3-7-3-10-1v15c3-2 7-2 10 1 3-3 7-3 10-1V4c-3-2-7-2-10 1Zm0 0v15M5 8h4M15 8h4M5 12h4M15 12h4"/></svg></span><small>菜谱</small></button><button data-screen="growth"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 17V12h4v5M14 17V8h4v9M4 9l6-5 4 2 6-4M16 2h4v4"/></svg></span><small>成长</small></button><button data-screen="guests"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3M7 21v-4M17 21v-4"/></svg></span><small>客人</small></button><button data-screen="logs"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM6 8h12M6 12h9"/></svg></span><small>见闻</small></button></nav>
<section id="serving-tray" class="serving-tray"><div class="tray-title">待出餐 <b id="ready-count"></b><small id="serving-hint"></small></div><div id="ready-dishes"></div></section>
<button id="scene-news" class="scene-news" data-screen="logs"></button><div class="scene-footer"><span id="service-stats"></span><span id="save-status"></span></div>
<div class="action-dock"><form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">模拟弹幕</label><input id="chat-input" autocomplete="off" placeholder="说点什么，如「出餐」" maxlength="40"><button type="submit" aria-label="发送模拟弹幕">↗</button></form><button id="serve-button" class="serve-button">出 餐</button></div>
</div>
<div id="page-scrim" class="page-scrim" hidden></div>
<section id="page-overview" class="game-page" hidden aria-label="饭馆总览"><header class="page-header"><button data-screen="home" aria-label="返回经营">‹</button><h1>我的饭馆</h1><button data-screen="home" aria-label="关闭饭馆总览">×</button></header><nav class="page-tabs"><button data-screen="overview">总览</button><button data-screen="menu">菜谱</button><button data-screen="growth">成长</button><button data-screen="guests">客人</button></nav><div id="overview-content" class="page-content"></div></section>
<section id="page-menu" class="game-page" hidden aria-label="菜谱页面"><header class="page-header"><button data-screen="home" aria-label="返回经营">‹</button><h1>百味菜谱</h1><button data-screen="home" aria-label="关闭菜谱">×</button></header><nav class="page-tabs"><button data-screen="overview">总览</button><button data-screen="menu">菜谱</button><button data-screen="growth">成长</button><button data-screen="guests">客人</button></nav><div id="menu-panel" class="menu-page-body"><div class="menu-caption">今日上架 <b id="menu-capacity"></b><span class="pager"><button id="menu-prev" data-paginate="-1" aria-label="上一页菜谱">‹</button><span id="menu-page-label"></span><button id="menu-next" data-paginate="1" aria-label="下一页菜谱">›</button></span></div><div class="tier-filter" aria-label="品级筛选"><button class="active" data-tier="0">全部</button><button data-tier="1">一品</button><button data-tier="2">二品</button><button data-tier="3">三品</button></div><div id="dish-list" class="dish-list"></div><div id="dish-detail" class="dish-detail"></div></div></section>
<section id="page-growth" class="game-page" hidden aria-label="成长页面"><header class="page-header"><button data-screen="home" aria-label="返回经营">‹</button><h1>小店成长</h1><button data-screen="home" aria-label="关闭成长">×</button></header><nav class="page-tabs"><button data-screen="overview">总览</button><button data-screen="menu">菜谱</button><button data-screen="growth">成长</button><button data-screen="guests">客人</button></nav><div id="upgrade-panel" class="page-content"><div id="upgrades"></div></div></section>
<section id="page-guests" class="game-page" hidden aria-label="客人页面"><header class="page-header"><button data-screen="home" aria-label="返回经营">‹</button><h1>街坊食客</h1><button data-screen="home" aria-label="关闭客人">×</button></header><nav class="page-tabs"><button data-screen="overview">总览</button><button data-screen="menu">菜谱</button><button data-screen="growth">成长</button><button data-screen="guests">客人</button></nav><div class="page-content"><div id="guest-list" class="guest-list"></div><div id="guest-detail"></div></div></section>
<section id="page-logs" class="game-page" hidden aria-label="经营见闻页面"><header class="page-header"><button data-screen="home" aria-label="返回经营">‹</button><h1>小店见闻</h1><button data-screen="home" aria-label="关闭见闻">×</button></header><div class="log-heading"><span>经营与模拟弹幕</span><select id="log-filter" aria-label="筛选经营日志"><option value="all">全部动态</option><option value="business">经营动态</option><option value="gift">礼物互动</option><option value="leave">客人流失</option></select></div><div id="event-log" class="event-log" role="log" aria-live="off"></div><form id="log-chat-form" class="chat-form"><label class="sr-only" for="log-chat-input">模拟弹幕</label><input id="log-chat-input" placeholder="模拟弹幕，如「甜甜圈」" maxlength="40"><button type="submit" aria-label="发送模拟弹幕">↗</button></form></section>
<aside id="page-service" class="page-service" hidden aria-label="管理页面出餐提醒"><span id="page-service-text"></span><button id="page-serve-button">出餐</button></aside>
<div id="toast" role="status" class="toast" hidden></div><dialog id="info-dialog"><header class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭弹窗">×</button></header><div id="dialog-body" class="dialog-body"></div></dialog>
</main></body></html>
